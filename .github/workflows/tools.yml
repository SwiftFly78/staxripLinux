name: Tools

# Builds the bundled tools of the full AppImage when their recipes change, so the release finds them in the cache
# and broken recipes show up before a release.
on:
  push:
    branches: [master]
    paths: ['Bundle/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tools

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: Bundle/.cache
          key: bundle-${{ hashFiles('Bundle/**', '!Bundle/README.md') }}
          restore-keys: bundle-

      - name: Build the bundled tools
        run: Bundle/build.sh

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-logs
          path: Bundle/.cache/logs
