name: 🐞 Report a bug
description: Create a report to point on an issue
body:
  - type: textarea
    id: whathappened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: whatisexpected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: input
    id: version
    attributes:
      label: StaxRipLinux version
      description: The version in the title bar. Please make sure to test the latest release.
      placeholder: e.g. v1.45.34
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution
      description: The Linux distribution and its version.
      placeholder: e.g. Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Full AppImage
        - Slim AppImage
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: frameserver
    attributes:
      label: Frame Server
      multiple: true
      options:
        - AviSynth+
        - VapourSynth
  - type: textarea
    id: moreinfo
    attributes:
      label: Additional information
      description: |
        Add any other context about the problem here.
        If applicable, add screenshots or a log file. To export a safer log, open Project > Log File, right-click the log, and select Save Obfuscated As.
        Review the saved file before attaching it. Obfuscation changes the current source path and name, but other paths, scripts, command lines, and system details may remain.
